<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sun Son Solar</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            display: flex;
            background: white;
        }

        /* LEFT SIDE */
        .left-side {
            width: 47%;
            min-height: 100vh;
            background-image:
                linear-gradient(rgba(0, 0, 0, 0.25), rgba(0, 0, 0, 0.25)),
                url("Side.jpg.png");
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px;
        }

        .branding {
            color: white;
        }

        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 20px;
        }

        .branding h1 {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 2px;
            margin-bottom: 10px;
        }

        .branding p {
            font-size: 18px;
            letter-spacing: 1px;
        }

        /* RIGHT SIDE */
        .right-side {
            width: 53%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 60px;
            overflow-y: auto;
        }

        .form-container {
            width: 100%;
            max-width: 650px;
        }

        .form-box {
            display: none;
        }

        .form-box.active {
            display: block;
        }

        .form-header {
            margin-bottom: 25px;
        }

        .form-header h2 {
            font-size: 32px;
            color: #222;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #777;
            font-size: 15px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group.full {
            grid-column: 1 / -1;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 7px;
        }

        input,
        select {
            width: 100%;
            height: 45px;
            border: 1px solid #d5d5d5;
            border-radius: 7px;
            padding: 0 13px;
            font-size: 14px;
            outline: none;
            background: white;
        }

        input:focus,
        select:focus {
            border-color: #e0a800;
            box-shadow: 0 0 0 2px rgba(224, 168, 0, 0.12);
        }

        .password-wrapper {
            position: relative;
        }

        .password-wrapper input {
            padding-right: 70px;
        }

        .show-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: none;
            color: #b48600;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn {
            width: 100%;
            height: 47px;
            border: none;
            border-radius: 7px;
            background: #e0a800;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.2s;
        }

        .btn:hover {
            background: #c99500;
        }

        .switch-text {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
            color: #777;
        }

        .switch-link {
            color: #c28d00;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
        }

        .switch-link:hover {
            text-decoration: underline;
        }

        .message {
            display: none;
            padding: 11px;
            margin-top: 15px;
            border-radius: 6px;
            background: #fff4cc;
            color: #765900;
            font-size: 13px;
            text-align: center;
        }

        .login-form {
            max-width: 430px;
            margin: auto;
        }

        /* MOBILE */
        @media (max-width: 850px) {
            .container {
                flex-direction: column;
            }

            .left-side {
                width: 100%;
                min-height: 280px;
                padding: 30px;
            }

            .right-side {
                width: 100%;
                min-height: auto;
                padding: 40px 25px;
            }

            .logo {
                width: 100px;
                height: 100px;
            }

            .branding h1 {
                font-size: 30px;
            }

            .branding p {
                font-size: 15px;
            }
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }

            .input-group.full {
                grid-column: auto;
            }

            .form-header h2 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- LEFT SIDE -->
    <div class="left-side">
        <div class="branding">
            <img src="transL.jpg.png" alt="Sun Son Solar Logo" class="logo">

            <h1>SUN SON SOLAR</h1>

            <p>When Light Becomes Power</p>
        </div>
    </div>


    <!-- RIGHT SIDE -->
    <div class="right-side">

        <div class="form-container">

            <!-- LOGIN FORM -->
            <div class="form-box active" id="loginForm">

                <div class="login-form">

                    <div class="form-header">
                        <h2><i>Sun Son Solar</i></h2>
                        <p>Login to your Sun Son Solar account.</p>
                    </div>

                    <form id="login">

                        <div class="input-group">
                            <label for="loginUsername">Username</label>
                            <input
                                type="text"
                                id="loginUsername"
                                placeholder="Enter your username"
                                required
                            >
                        </div>

                        <br>

                        <div class="input-group">
                            <label for="loginPassword">Password</label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="loginPassword"
                                    placeholder="Enter your password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('loginPassword', this)"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <button type="submit" class="btn">
                            Login
                        </button>

                        <div class="message" id="loginMessage"></div>

                    </form>

                    <div class="switch-text">
                        Don't have an account?
                        <span class="switch-link" onclick="showRegister()">
                            Sign Up
                        </span>
                    </div>

                </div>

            </div>


            <!-- REGISTRATION FORM -->
            <div class="form-box" id="registerForm">

                <div class="form-header">
                    <h2>Create an Account</h2>
                    <p>Register to get started with Sun Son Solar.</p>
                </div>

                <form id="registration">

                    <div class="form-grid">

                        <!-- ACCOUNT TYPE -->
                        <div class="input-group full">
                            <label for="accountType">Account Type</label>

                            <select id="accountType" onchange="toggleDepartment()" required>
                                <option value="">Select Account Type</option>
                                <option value="Customer">Customer</option>
                                <option value="Employee">Employee</option>
                            </select>
                        </div>

                        <!-- FIRST NAME -->
                        <div class="input-group">
                            <label for="firstName">First Name</label>
                            <input 
                                 type="text"
                                 id="firstName"
                                 placeholder="First Name"
                                 oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
                                 equired
                                         >
                        </div>

                        <!-- MIDDLE NAME -->
                        <div class="input-group">
                            <label for="middleName">Middle Name</label>
                             <input 
                                 type="text"
                                 id="middleName"
                                 placeholder="Middle Name"
                                 oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
                                 equired
                                         >
                        </div>

                        <!-- LAST NAME -->
                        <div class="input-group">
                            <label for="lastName">Last Name</label>
                             <input 
                                 type="text"
                                 id="lastName"
                                 placeholder="Last Name"
                                 oninput="this.value = this.value.replace(/[^A-Za-z\s]/g, '')"
                                 equired
                                         >
                        </div>

                        <!-- BIRTHDATE -->
                        <div class="input-group">
                            <label for="birthdate">Birthdate</label>
                            <input
                                type="date"
                                id="birthdate"
                                required
                            >
                        </div>

                        <!-- GENDER -->
                        <div class="input-group">
                            <label for="gender">Gender</label>

                            <select id="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- EMAIL -->
                        <div class="input-group">
                            <label for="email">Email</label>
                            <input
                                type="email"
                                id="email"
                                placeholder="example@email.com"
                                required
                            >
                        </div>

                        <!-- PHONE -->
                        <div class="input-group">
                            <label for="phone">Phone Number</label>
                        <input 
    type="text"
    id="phone"
    placeholder="09XXXXXXXXX"
    maxlength="11"
    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
    required
>
                        </div>

                        <!-- ADDRESS -->
                        <div class="input-group full">
                            <label for="address">Address</label>
                            <input
                                type="text"
                                id="address"
                                placeholder="Complete address"
                                required
                            >
                        </div>

                        <!-- USERNAME -->
                        <div class="input-group">
                            <label for="username">Username</label>
                            <input
                                type="text"
                                id="username"
                                placeholder="Create username"
                                required
                            >
                        </div>

                        <!-- PASSWORD -->
                        <div class="input-group">
                            <label for="password">Password</label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Create password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('password', this)"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <!-- CONFIRM PASSWORD -->
                        <div class="input-group">
                            <label for="confirmPassword">Confirm Password</label>

                            <div class="password-wrapper">
                                <input
                                    type="password"
                                    id="confirmPassword"
                                    placeholder="Confirm password"
                                    required
                                >

                                <button
                                    type="button"
                                    class="show-password"
                                    onclick="togglePassword('confirmPassword', this)"
                                >
                                    Show
                                </button>
                            </div>
                        </div>

                        <!-- DEPARTMENT -->
                        <div class="input-group" id="departmentGroup" style="display: none;">
                            <label for="department">Department</label>

                            <input
                                type="text"
                                id="department"
                                placeholder="Employee department"
                            >
                        </div>

                    </div>

                    <button type="submit" class="btn">
                        Sign Up
                    </button>

                    <div class="message" id="registerMessage"></div>

                </form>

                <div class="switch-text">
                    Already have an account?
                    <span class="switch-link" onclick="showLogin()">
                        Login
                    </span>
                </div>

            </div>

        </div>

    </div>

</div>


<script>

    /* ================================
       LOCAL STORAGE KEYS
    ================================= */

    const ACCOUNTS_KEY = "sunSonAccounts";
    const CURRENT_USER_KEY = "sunSonCurrentUser";


    /* ================================
       FORM SWITCHING
    ================================= */

    function showRegister() {
        document.getElementById("loginForm").classList.remove("active");
        document.getElementById("registerForm").classList.add("active");
        clearMessage("loginMessage");
    }


    function showLogin() {
        document.getElementById("registerForm").classList.remove("active");
        document.getElementById("loginForm").classList.add("active");
        clearMessage("registerMessage");
    }


    /* ================================
       PASSWORD SHOW / HIDE
    ================================= */

    function togglePassword(inputId, button) {
        const input = document.getElementById(inputId);

        if (input.type === "password") {
            input.type = "text";
            button.textContent = "Hide";
        } else {
            input.type = "password";
            button.textContent = "Show";
        }
    }


    /* ================================
       EMPLOYEE DEPARTMENT
    ================================= */

    function toggleDepartment() {
        const accountType =
            document.getElementById("accountType").value;

        const departmentGroup =
            document.getElementById("departmentGroup");

        const department =
            document.getElementById("department");

        if (accountType === "Employee") {
            departmentGroup.style.display = "flex";
            department.required = true;
        } else {
            departmentGroup.style.display = "none";
            department.required = false;
            department.value = "";
        }
    }


    /* ================================
       MESSAGE HELPER
    ================================= */

    function showMessage(elementId, message, type = "warning") {
        const messageBox =
            document.getElementById(elementId);

        messageBox.style.display = "block";
        messageBox.textContent = message;

        if (type === "success") {
            messageBox.style.background = "#e9f8ef";
            messageBox.style.color = "#176b3a";
        } else if (type === "error") {
            messageBox.style.background = "#ffeaea";
            messageBox.style.color = "#9b2c2c";
        } else {
            messageBox.style.background = "#fff4cc";
            messageBox.style.color = "#765900";
        }
    }


    function clearMessage(elementId) {
        const messageBox =
            document.getElementById(elementId);

        if (messageBox) {
            messageBox.style.display = "none";
            messageBox.textContent = "";
        }
    }


    /* ================================
       GET SAVED ACCOUNTS
    ================================= */

    function getAccounts() {
        try {
            const saved =
                localStorage.getItem(ACCOUNTS_KEY);

            return saved ? JSON.parse(saved) : [];
        } catch (error) {
            console.error("Unable to read accounts:", error);
            return [];
        }
    }


    /* ================================
       SAVE ACCOUNTS
    ================================= */

    function saveAccounts(accounts) {
        localStorage.setItem(
            ACCOUNTS_KEY,
            JSON.stringify(accounts)
        );
    }


    /* ================================
       LOGIN
    ================================= */

    document
        .getElementById("login")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const username =
                document
                    .getElementById("loginUsername")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("loginPassword")
                    .value;

            const accounts = getAccounts();

            clearMessage("loginMessage");

            if (!username || !password) {
                showMessage(
                    "loginMessage",
                    "Please enter your username and password.",
                    "error"
                );
                return;
            }


            /* Find account */
            const account =
                accounts.find(function(user) {
                    return (
                        user.username.toLowerCase() ===
                        username.toLowerCase()
                    );
                });


            /* Account does not exist */
            if (!account) {
                showMessage(
                    "loginMessage",
                    "Account not registered. Please sign up first.",
                    "error"
                );
                return;
            }


            /* Incorrect password */
            if (account.password !== password) {
                showMessage(
                    "loginMessage",
                    "Incorrect password. Please try again.",
                    "error"
                );
                return;
            }


            /* Save current logged-in user */
            localStorage.setItem(
                CURRENT_USER_KEY,
                JSON.stringify(account)
            );


            showMessage(
                "loginMessage",
                "Login successful! Opening dashboard...",
                "success"
            );


            /* Open dashboard */
            setTimeout(function() {
                window.location.href = "dashboard.html";
            }, 700);
        });


    /* ================================
       REGISTRATION
    ================================= */

    document
        .getElementById("registration")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            clearMessage("registerMessage");


            const accountType =
                document.getElementById("accountType").value;

            const firstName =
                document.getElementById("firstName").value.trim();

            const middleName =
                document.getElementById("middleName").value.trim();

            const lastName =
                document.getElementById("lastName").value.trim();

            const birthdate =
                document.getElementById("birthdate").value;

            const gender =
                document.getElementById("gender").value;

            const email =
                document.getElementById("email").value.trim();

            const phone =
                document.getElementById("phone").value.trim();

            const address =
                document.getElementById("address").value.trim();

            const username =
                document.getElementById("username").value.trim();

            const password =
                document.getElementById("password").value;

            const confirmPassword =
                document.getElementById("confirmPassword").value;

            const department =
                document.getElementById("department").value.trim();


            /* ================================
               BASIC VALIDATION
            ================================= */

            if (!accountType ||
                !firstName ||
                !lastName ||
                !birthdate ||
                !gender ||
                !email ||
                !phone ||
                !address ||
                !username ||
                !password ||
                !confirmPassword) {

                showMessage(
                    "registerMessage",
                    "Please complete all required fields.",
                    "error"
                );

                return;
            }


            /* Name validation */
            const namePattern =
                /^[A-Za-zÀ-ÿ\s'-]+$/;

            if (!namePattern.test(firstName) ||
                (middleName && !namePattern.test(middleName)) ||
                !namePattern.test(lastName)) {

                showMessage(
                    "registerMessage",
                    "Names should contain letters only.",
                    "error"
                );

                return;
            }


            /* Password length */
            if (password.length < 6) {

                showMessage(
                    "registerMessage",
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            /* Password confirmation */
            if (password !== confirmPassword) {

                showMessage(
                    "registerMessage",
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            /* Employee department */
            if (accountType === "Employee" && !department) {

                showMessage(
                    "registerMessage",
                    "Please enter your department.",
                    "error"
                );

                return;
            }


            const accounts = getAccounts();


            /* ================================
               CHECK DUPLICATE USERNAME
            ================================= */

            const usernameExists =
                accounts.some(function(user) {
                    return (
                        user.username.toLowerCase() ===
                        username.toLowerCase()
                    );
                });

            if (usernameExists) {

                showMessage(
                    "registerMessage",
                    "Username already exists. Please choose another username.",
                    "error"
                );

                return;
            }


            /* ================================
               CHECK DUPLICATE EMAIL
            ================================= */

            const emailExists =
                accounts.some(function(user) {
                    return (
                        user.email.toLowerCase() ===
                        email.toLowerCase()
                    );
                });

            if (emailExists) {

                showMessage(
                    "registerMessage",
                    "This email is already registered.",
                    "error"
                );

                return;
            }


            /* ================================
               CREATE ACCOUNT
            ================================= */

            const newAccount = {

                id:
                    Date.now().toString(),

                accountType:
                    accountType,

                firstName:
                    firstName,

                middleName:
                    middleName,

                lastName:
                    lastName,

                birthdate:
                    birthdate,

                gender:
                    gender,

                email:
                    email,

                phone:
                    phone,

                address:
                    address,

                department:
                    accountType === "Employee"
                        ? department
                        : "",

                username:
                    username,

                password:
                    password,

                status:
                    "approved",

                createdAt:
                    new Date().toISOString()
            };


            accounts.push(newAccount);

            saveAccounts(accounts);


            /* ================================
               SUCCESS
            ================================= */

            showMessage(
                "registerMessage",
                "Registration successful! Your account has been saved. You can now login.",
                "success"
            );


            /* Reset registration form */
            document
                .getElementById("registration")
                .reset();

            toggleDepartment();


            /* Go back to login */
            setTimeout(function() {

                showLogin();

                document
                    .getElementById("loginUsername")
                    .value = username;

            }, 1200);
        });


    /* ================================
       OPTIONAL: LOGGED-IN USER
       If already logged in, do not
       automatically redirect here.
       This allows users to register
       another account if needed.
    ================================= */

    console.log(
        "Sun Son Solar Local Storage Accounts:",
        getAccounts()
    );

</script>

</body>
</html>
